services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-isg_brain}
      POSTGRES_USER: ${POSTGRES_USER:-isg}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-localdev}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-isg} -d ${POSTGRES_DB:-isg_brain}"]
      interval: 10s
      timeout: 5s
      retries: 10

  chromadb:
    image: chromadb/chroma:0.5.23
    restart: unless-stopped
    ports:
      - "${CHROMA_PORT:-8000}:8000"
    volumes:
      - chroma-data:/chroma/chroma

  api:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    command: >
      sh -lc "node scripts/migrate.js && node src/api/server.js"
    depends_on:
      postgres:
        condition: service_healthy
      chromadb:
        condition: service_started
    ports:
      - "${API_PORT:-3100}:3100"
    volumes:
      - app-data:/app/data
      - app-logs:/app/logs
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3100/health').then((res)=>process.exit(res.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 10s
      retries: 10

  scheduler:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    command: ["node", "scripts/start-scheduler.js"]
    depends_on:
      api:
        condition: service_healthy
    volumes:
      - app-data:/app/data
      - app-logs:/app/logs

  telegram-bot:
    profiles: ["polling"]
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    command: ["node", "scripts/run-telegram-bot.js"]
    depends_on:
      api:
        condition: service_healthy
    volumes:
      - app-data:/app/data
      - app-logs:/app/logs

volumes:
  postgres-data:
  chroma-data:
  app-data:
  app-logs:
